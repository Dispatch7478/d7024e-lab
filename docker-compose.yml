# See https://docs.docker.com/compose/compose-file/ for information about what
# commands you can use in this file.
#
# Note that you must use the `docker stack deploy` command, with any required
# command line flags, in order to actually get any replicas started. That
# command requires that a docker swarm is already running in order to function.

version: "3"
services:

  kademlia-bootstrap:
    image: kadlab:latest 
    container_name: kademlia-bootstrap 
    networks:
      kademlia_network:
        ipv4_address: 172.20.0.2

  kademliaNodes:
    image: kadlab:latest # Make sure your Docker image has this name.
    build: .
    stdin_open: true
    tty: true
    environment:
      - BOOTSTRAP_IP=172.20.0.2
    deploy:
      mode: replicated
      replicas: 5  
#        resources:
#           limits:
#              cpus: "0.1"
#              memory: 50M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 10s
#    ports:
#      - "4000:80"
    networks:
      - kademlia_network
    depends_on:
      - kademlia-bootstrap
      
networks:
  kademlia_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
